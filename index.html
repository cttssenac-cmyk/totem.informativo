<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salas de Aula</title>

  <style>
    :root{
      --bg: #4D2F40;
      --panel: #004A8D;
      --panel2: #005692;

      --text: #ffffff;
      --muted: rgba(255,255,255,.78);
      --line: rgba(255,255,255,.14);

      --accent: #F7941D;
      --accentSoft: #FDC180;
      --info: #79CEDC;

      --radius: 18px;
      --shadow: 0 14px 40px rgba(0,0,0,.35);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1100px 600px at 15% 10%, rgba(121,206,220,.25), transparent 58%),
        radial-gradient(900px 500px at 85% 18%, rgba(247,148,30,.18), transparent 55%),
        linear-gradient(180deg, rgba(0,74,141,.22), rgba(0,74,141,0) 55%),
        var(--bg);
    }

    .wrap{
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(14px, 2.5vw, 28px);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
      justify-items: center; /* centraliza tudo */
      align-content: start;
    }

    /* Logo */
    .logoBox{
      width: 100%;
      display: grid;
      place-items: center;
      padding-top: 6px;
    }
    .logoBox img{
      width: clamp(110px, 18vw, 190px);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.25));
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Header centralizado */
    .topbar{
      width: 100%;
      padding: 20px 18px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0));
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    h1{
      margin: 0;
      font-size: clamp(40px, 5.2vw, 78px);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .period{
      margin-top: 10px;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 900;
      letter-spacing: .01em;
      color: var(--accentSoft);
    }

    .date{
      margin-top: 4px;
      font-size: clamp(14px, 1.7vw, 18px);
      color: var(--muted);
    }

    .clock{
      margin-top: 8px;
      font-size: clamp(20px, 2.4vw, 34px);
      font-weight: 950;
      letter-spacing: .08em;
      color: rgba(255,255,255,.92);
    }

    /* Mini bar central */
    .mini{
      width: 100%;
      display:flex;
      flex-wrap: wrap;
      align-items:center;
      justify-content: center;
      gap: 10px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0,74,141,.22);
      color: var(--text);
      font-weight: 750;
      font-size: 13px;
      user-select:none;
      white-space:nowrap;
    }
    .chip small{ color: rgba(255,255,255,.72); font-weight:650; }

    .btn{
      cursor:pointer;
      border: 1px solid rgba(247,148,30,.55);
      background: linear-gradient(180deg, rgba(247,148,30,.95), rgba(247,148,30,.70));
      color: #1b0f17;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 950;
      font-size: 13px;
      letter-spacing:.01em;
      transition: transform .08s ease, filter .12s ease;
    }
    .btn:hover{ filter: brightness(1.06); }
    .btn:active{ transform: translateY(1px); }

    /* Dados (sem títulos de colunas) */
    .panel{
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: linear-gradient(180deg, rgba(0,74,141,.46), rgba(0,86,146,.26));
      backdrop-filter: blur(10px);
    }

    table{ width:100%; border-collapse: collapse; }
    thead{ display:none; }

    /* 3 colunas por linha (A, B, C) */
    tbody tr{
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      border-bottom: 1px solid var(--line);
    }
    tbody tr:last-child{ border-bottom: none; }

    tbody td{
      padding: 14px 14px;
      font-size: clamp(14px, 1.7vw, 20px);
      text-align: center;
      color: rgba(255,255,255,.95);
      word-break: break-word;
    }

    tbody tr:nth-child(2n){
      background: rgba(255,255,255,.05);
    }

    .changed{
      background: rgba(121,206,220,.20) !important;
    }

    .empty{
      padding: 18px 16px;
      color: rgba(255,255,255,.80);
      text-align: center;
    }

    /* Mobile: empilha A/B/C (sem rótulos) */
    @media (max-width: 720px){
      tbody tr{
        grid-template-columns: 1fr;
        padding: 10px 8px;
      }
      tbody td{
        padding: 10px 10px;
        border-top: 1px dashed rgba(255,255,255,.14);
      }
      tbody td:first-child{ border-top: none; }
    }

    /* Status bem pequeno embaixo */
    .footerStatus{
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      padding: 6px 2px 2px;
    }
    .footerStatus .ok{ color: rgba(121,206,220,.95); }
    .footerStatus .bad{ color: rgba(255,107,107,.95); }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- ✅ Logo acima de tudo -->
    <div class="logoBox">
      <img src="logo-senac.png" alt="Senac" />
    </div>

    <!-- ✅ Título + período + dia centralizados -->
    <div class="topbar">
      <h1>Salas de Aula</h1>
      <div class="period" id="periodLabel">—</div>
      <div class="date" id="dateLabel">—</div>

      <!-- ✅ Relógio abaixo do dia -->
      <div class="clock" id="clockLabel">--:--:--</div>
    </div>

    <div class="mini">
      <div class="chip"><small>Atualiza</small> <span id="pollLabel">—</span></div>
      <div class="chip"><small>Última</small> <span id="lastLabel">—</span></div>
      <button class="btn" id="fsBtn">Tela cheia</button>
    </div>

    <!-- ✅ Sem títulos de coluna -->
    <div class="panel">
      <table aria-label="Salas de aula">
        <tbody id="tbody">
          <tr><td class="empty">Carregando dados…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ✅ Status abaixo de tudo -->
    <div class="footerStatus" id="smallStatus">—</div>
  </div>

<script>
  // ==============================
  // CONFIG
  // ==============================
  const TZ = "America/Sao_Paulo";

  // ✅ Endpoint direto (atualiza melhor que pub?output=csv)
  const SHEET_CSV_BASE =
    "https://docs.google.com/spreadsheets/d/1L7Rf7ksHbH_L2-yjQl6kqg464j1aqNRdFOAPuLJNXm8/export?format=csv&gid=356224596";

  // Atualização rápida (TV): 2000–5000ms costuma ser estável
  const POLL_MS = 3000;

  // Range alvo A29:C48
  const START_ROW = 29;
  const END_ROW   = 48;

  // ==============================
  // ELEMENTOS
  // ==============================
  const periodEl = document.getElementById("periodLabel");
  const dateEl = document.getElementById("dateLabel");
  const clockEl = document.getElementById("clockLabel");
  const tbody = document.getElementById("tbody");
  const lastLabel = document.getElementById("lastLabel");
  const pollLabel = document.getElementById("pollLabel");
  const fsBtn = document.getElementById("fsBtn");
  const smallStatus = document.getElementById("smallStatus");

  pollLabel.textContent = `${Math.round(POLL_MS/1000)}s`;

  // ==============================
  // TEMPO / RÓTULOS
  // ==============================
  function nowInTZDate(){
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
    }).formatToParts(new Date());
    const get = (t) => parts.find(p => p.type === t)?.value;
    return new Date(`${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}:${get("second")}`);
  }

  function getPeriodLabel(date){
    const total = date.getHours()*60 + date.getMinutes();
    if (total <= (11*60 + 30)) return "Manhã";
    if (total <= (17*60 + 30)) return "Tarde";
    return "Noite";
  }

  function formatPtBrLongDate(date){
    // "segunda-feira, 16 de fevereiro de 2026"
    return new Intl.DateTimeFormat("pt-BR", {
      timeZone: TZ, weekday:"long", day:"numeric", month:"long", year:"numeric"
    }).format(date);
  }

  function pad2(n){ return String(n).padStart(2, "0"); }

  // Relógio em tempo real (melhor esforço)
  // - Tenta usar um "offset de rede" (sincronizado quando conseguirmos inferir)
  // - Se não der, segue o horário local com timezone configurado
  let networkOffsetMs = 0;

  function setHeaderClock(){
    const tzNow = nowInTZDate();
    periodEl.textContent = getPeriodLabel(tzNow);
    dateEl.textContent = formatPtBrLongDate(tzNow);
  }

  function renderClock(){
    // usa Date.now() + offset e aplica timezone
    const adjusted = new Date(Date.now() + networkOffsetMs);
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: TZ, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
    }).formatToParts(adjusted);
    const get = (t) => parts.find(p => p.type === t)?.value;
    clockEl.textContent = `${get("hour")}:${get("minute")}:${get("second")}`;
  }

  // ==============================
  // CSV (parser simples com aspas)
  // ==============================
  function parseCSV(text){
    const rows = [];
    let row = [], cell = "", inQuotes = false;

    for (let i=0;i<text.length;i++){
      const c = text[i];
      const next = text[i+1];

      if (c === '"' && inQuotes && next === '"'){ cell += '"'; i++; continue; }
      if (c === '"'){ inQuotes = !inQuotes; continue; }

      if (!inQuotes && c === ','){ row.push(cell); cell = ""; continue; }
      if (!inQuotes && c === '\n'){
        row.push(cell); rows.push(row);
        row = []; cell = "";
        continue;
      }
      if (c !== '\r') cell += c;
    }
    if (cell.length || row.length){ row.push(cell); rows.push(row); }
    return rows;
  }

  function escapeHtml(str){
    return String(str ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  // ==============================
  // RENDER (somente linhas preenchidas)
  // ==============================
  let lastDataKey = null;

  function render(rowsABC){
    const nonEmpty = rowsABC.filter(r => ((r[0]||"") + (r[1]||"") + (r[2]||"")).trim() !== "");

    if (!nonEmpty.length){
      tbody.innerHTML = `<tr><td class="empty">Sem dados em A${START_ROW}:C${END_ROW}.</td></tr>`;
      return;
    }

    const dataKey = nonEmpty.map(r => r.join("¦")).join("§");
    const changed = (lastDataKey !== null && dataKey !== lastDataKey);
    lastDataKey = dataKey;

    tbody.innerHTML = nonEmpty.map(r => {
      return `<tr>
        <td>${escapeHtml(r[0])}</td>
        <td>${escapeHtml(r[1])}</td>
        <td>${escapeHtml(r[2])}</td>
      </tr>`;
    }).join("");

    if (changed){
      [...tbody.querySelectorAll("tr")].forEach(tr => tr.classList.add("changed"));
      setTimeout(() => {
        [...tbody.querySelectorAll("tr")].forEach(tr => tr.classList.remove("changed"));
      }, 900);
    }
  }

  function setSmallStatus(kind, msg){
    const cls = kind === "ok" ? "ok" : kind === "bad" ? "bad" : "";
    smallStatus.innerHTML = `<span class="${cls}">${escapeHtml(msg)}</span>`;
  }

  // ==============================
  // LOOP DE ATUALIZAÇÃO (com backoff)
  // ==============================
  let timer = null;
  let backoff = POLL_MS;

  async function tick(){
    try{
      setHeaderClock();

      // cache-buster real
      const url = `${SHEET_CSV_BASE}&_cb=${Date.now()}`;

      const res = await fetch(url, {
        cache: "no-store",
        headers: { "Pragma": "no-cache", "Cache-Control": "no-cache" }
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      // Melhor esforço: sincronizar "tempo de rede" via cabeçalho Date (se exposto)
      // (se não vier, seguimos com offset 0)
      const dateHeader = res.headers.get("Date");
      if (dateHeader) {
        const serverMs = new Date(dateHeader).getTime();
        if (!Number.isNaN(serverMs)) {
          networkOffsetMs = serverMs - Date.now();
        }
      }

      const csv = await res.text();
      const all = parseCSV(csv);

      // A29 => índice 28 (0-based). A48 => índice 47.
      const startIdx = START_ROW - 1;
      const endIdx = END_ROW - 1;

      const slice = all.slice(startIdx, endIdx + 1).map(r => [
        (r[0] ?? "").trim(),
        (r[1] ?? "").trim(),
        (r[2] ?? "").trim(),
      ]);

      render(slice);

      const tzNow = nowInTZDate();
      lastLabel.textContent = tzNow.toLocaleTimeString("pt-BR", { timeZone: TZ });

      setSmallStatus("ok", "Online · Dados atualizados");
      backoff = POLL_MS;
    } catch (e){
      setSmallStatus("bad", "Falha ao atualizar · Tentando reconectar");
      backoff = Math.min(Math.round(backoff * 1.6), 60000);
    } finally {
      clearTimeout(timer);
      timer = setTimeout(tick, backoff);
    }
  }

  // ==============================
  // FULLSCREEN (TV)
  // ==============================
  function isFullscreen(){ return !!document.fullscreenElement; }
  async function toggleFullscreen(){
    try{
      if (!isFullscreen()) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch {}
  }
  fsBtn.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => {
    fsBtn.textContent = isFullscreen() ? "Sair da tela cheia" : "Tela cheia";
  });

  // Start
  setHeaderClock();
  renderClock();
  setInterval(setHeaderClock, 10000);
  setInterval(renderClock, 250); // fluido para TV
  tick();
</script>
</body>
</html>
